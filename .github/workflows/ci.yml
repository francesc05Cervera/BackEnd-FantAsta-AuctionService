name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fantasta
          POSTGRES_PASSWORD: fantasta
          POSTGRES_DB: fantasta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U fantasta -d fantasta_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Warm Maven dependencies with retry
        shell: bash
        run: |
          for delay in 0 15 45; do
            mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 dependency:go-offline && break
            sleep "$delay"
          done
      - run: mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 verify
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 dependency:go-offline
      - name: Scan third-party dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          scan-type: fs
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          offline-scan: true
          exit-code: '1'
